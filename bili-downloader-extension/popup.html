<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            width: 320px;
            padding: 15px;
            padding-bottom: 25px;
            /* 为底部的 fixed 元素预留空间 */
            background-color: #f8f9fa;
        }

        .container-custom {
            min-width: 290px;
        }
    </style>
</head>

<body>
    <div class="container container-custom">
        <h4 class="mb-4 text-primary">B 站下载器</h4>

        <div class="mb-3">
            <label for="downloadMode" class="form-label">下载模式</label>
            <select class="form-select" id="downloadMode">
                <option value="">默认</option>
                <option value="tv">TV 模式</option>
                <option value="app">APP 模式</option>
                <option value="intl">国际版</option>
            </select>
        </div>

        <div class="mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="convertToMp3" checked>
                <label class="form-check-label" for="convertToMp3">
                    转为 MP3
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="singlePageOnly" checked>
                <label class="form-check-label" for="singlePageOnly">
                    仅下载单曲 (针对选集)
                </label>
            </div>
        </div>

        <div class="d-grid gap-2">
            <button class="btn btn-primary" id="sendHtmlBtn">
                <i class="bi bi-download"></i> 处理当前收藏夹
            </button>
            <button class="btn btn-outline-secondary" id="SendLinkBtn">
                处理当前链接
            </button>
        </div>

        <div id="status" class="mt-3 small"></div>
    </div>

    <div id="versionInfo" style="position: fixed; bottom: 10px; right: 15px; font-size: 12px; color: #6c757d;"></div>

    <script src="popup.js"></script>
</body>

</html>
